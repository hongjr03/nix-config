name: check

on:
  push:
  pull_request:

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Evaluate the flake
        run: nix flake check --print-build-logs
      - name: Check formatting
        run: nix fmt -- --ci
